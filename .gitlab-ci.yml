---
# GitLab CI/CD Pipeline for slog
# SPDX-License-Identifier: Apache-2.0

default:
  interruptible: true
  tags:
    # company alone also matches the Hosted Windows Runners, which parse
    # these bash scripts with PowerShell and fail; require linux too.
    # dedicated pins jobs to the OVH Dedicated Runners pool.
    - company
    - linux
    - x86
    - dedicated

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "dedicated", "x86"]

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "dedicated", "x86"]

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "dedicated", "x86"]
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "dedicated", "x86"]

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "dedicated", "x86"]
      # Create the GitLab Release with CI_JOB_TOKEN: the group GITLAB_TOKEN
      # lacks api scope, so the default glab path fails with 403 (SONNY-2447).
      release_auth: job_token
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "dedicated", "x86"]

variables:
  ZIG_VERSION: "0.16.0"
  ZIG_CACHE_PLATFORM: "linux-x86_64"
  ZIG_GLOBAL_CACHE_DIR: "$CI_PROJECT_DIR/.zig-global"

# Only Zig jobs restore this cache. The build publishes Linux entries; the
# small native clock job publishes its separate macOS entry.
.zig-cache:
  cache: &zig-cache
    key: "slog-zig-v1-${ZIG_VERSION}-${ZIG_CACHE_PLATFORM}-${CI_COMMIT_REF_SLUG}"
    fallback_keys:
      - "slog-zig-v1-${ZIG_VERSION}-${ZIG_CACHE_PLATFORM}-${CI_DEFAULT_BRANCH}"
    paths:
      - .zig-cache/
      - .zig-global/p/
      - zig-${ZIG_VERSION}/
    policy: pull

stages:
  - lint
  - build
  - test
  - fuzz
  - security
  - sbom
  - release

# Zig installation template (SEC-R6-02: SHA-256 verified via ziglang.org index)
.install-zig: &install-zig
  - |
    if ! { command -v zig >/dev/null 2>&1 && [ "$(zig version)" = "$ZIG_VERSION" ]; } && [ ! -x "zig-${ZIG_VERSION}/zig" ]; then
      case "$(uname -s)" in
        Linux)
          ZIG_OS=linux
          apt-get update && apt-get install -y --no-install-recommends curl xz-utils python3 ca-certificates
          ;;
        Darwin)
          ZIG_OS=macos
          command -v python3 >/dev/null || { echo "python3 is required to verify Zig"; exit 1; }
          ;;
        *) echo "Unsupported OS: $(uname -s)"; exit 1 ;;
      esac
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64" ;;
        aarch64) ZIG_ARCH="aarch64" ;;
        arm64)   ZIG_ARCH="aarch64" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-${ZIG_OS}-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-${ZIG_OS}-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-${ZIG_OS}" ZIG_IDX="${INDEX_FILE}" \
        python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
      rm -f "${INDEX_FILE}"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      python3 -c 'import hashlib, pathlib, sys; actual = hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest(); sys.exit(0 if actual == sys.argv[2] else "Zig SHA-256 mismatch")' "$TARBALL" "$EXPECTED_HASH"
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
    fi
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - test "$(zig version)" = "$ZIG_VERSION"

# Override zig-format component to use the project's ZIG_VERSION.
# The v1.2.1 component defaults to 0.14.0 and does not accept a version input.
zig-format:
  variables:
    ZIG_VERSION: "0.16.0"
  cache: *zig-cache
  before_script:
    - *install-zig

# Build job
build:
  stage: build
  image: debian:bookworm-slim
  cache:
    <<: *zig-cache
    policy: pull-push
  before_script:
    - *install-zig
  script:
    - zig build check

# Unit tests
test:
  stage: test
  image: debian:bookworm-slim
  cache: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test --summary all
  needs:
    - build

# Release optimization tests
test-release-safe:
  stage: test
  image: debian:bookworm-slim
  cache: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all
  needs:
    - build

# ReleaseFast tests
test-release-fast:
  stage: test
  image: debian:bookworm-slim
  cache: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseFast --summary all
  needs:
    - build

# ReleaseSmall tests
test-release-small:
  stage: test
  image: debian:bookworm-slim
  cache: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSmall --summary all
  needs:
    - build

# Coverage-guided fuzz testing.
# Runs with a 60-second timeout so the job always terminates.
#
# Exit-code semantics:
#   rc=0  : fuzzer stopped cleanly before timeout (no crash)
#   rc=124: timeout reached (expected in CI) - pass
#   other : fuzzer found a crash - fail the job
fuzz:
  stage: fuzz
  image: debian:bookworm-slim
  cache: *zig-cache
  before_script:
    - *install-zig
  script:
    - timeout 60 zig build test --fuzz; rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi
  artifacts:
    when: on_failure
    paths:
      - zig-out/fuzz/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  allow_failure: true
  needs:
    - build

# Benchmark regression detection.
# Results are stored as artifacts for trend analysis.
bench-regression:
  stage: fuzz
  image: debian:bookworm-slim
  cache: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build bench -Doptimize=ReleaseFast 2>&1 | tee bench-results.txt
  artifacts:
    paths:
      - bench-results.txt
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  allow_failure: true
  needs:
    - build

# SONNY-4778: tools must not redirect Git operations into this worktree.
hook-env-regression:
  stage: lint
  image: python:3.15-slim-bookworm
  tags: [company, linux, x86]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
  script:
    - python3 scripts/test_hook_env.py

test-source-package:
  stage: test
  image: debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
  tags: [company, linux, x86]
  cache: *zig-cache
  before_script:
    - *install-zig
    - apt-get update && apt-get install -y --no-install-recommends git python3
  script:
    - python3 scripts/check_source_package.py --jobs 2
  needs:
    - build
  allow_failure: false

# The core API and shutdown must remain usable with the thread pool disabled.
test-no-thread-pool:
  stage: test
  image: debian:bookworm-slim
  cache: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test -Denable_tp=false --summary all
  needs:
    - build
  allow_failure: false

# Exercise the system clock on Darwin before expensive consumer suites.
# This has no external packages and catches accidental Linux syscalls.
test-clock-macos:
  stage: test
  tags: [saas-macos-medium-m1]
  timeout: 10m
  variables:
    ZIG_CACHE_PLATFORM: "macos-aarch64"
  cache:
    <<: *zig-cache
    policy: pull-push
  before_script:
    - *install-zig
  script:
    - zig test src/internal/clock.zig
  needs: []

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    # SRE-194: validation pipelines fail fast on the first blocking job failure;
    # these rules admit only what the next rule already admits.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      auto_cancel:
        on_job_failure: all
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      auto_cancel:
        on_job_failure: all
    - when: always
